name: Uptime Check

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  uptime:
    runs-on: ubuntu-latest
    # Secrets can't be referenced in `if:` directly, so expose them as env.
    # Each check is skipped (not failed) until its secrets are configured, so a
    # partial rollout doesn't open false incidents.
    env:
      BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Report missing secrets
        if: env.BASE_URL == '' || env.METRICS_TOKEN == ''
        run: |
          [ -z "$BASE_URL" ] && echo "PRODUCTION_BASE_URL secret is missing. Skipping all checks."
          [ -z "$METRICS_TOKEN" ] && echo "METRICS_TOKEN secret is missing. Skipping metrics check."
          exit 0

      - name: Health endpoint
        if: env.BASE_URL != ''
        run: |
          STATUS=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$BASE_URL/api/health")
          echo "Health status: $STATUS"
          test "$STATUS" = "200"

      - name: Metrics endpoint
        if: env.BASE_URL != '' && env.METRICS_TOKEN != ''
        run: |
          STATUS=$(curl -sS -o /tmp/metrics.json -w "%{http_code}" \
            -H "x-metrics-token: $METRICS_TOKEN" \
            "$BASE_URL/api/metrics")
          echo "Metrics status: $STATUS"
          test "$STATUS" = "200"

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Uptime check failed - ${new Date().toISOString()}`;
            const body = [
              'Automated uptime check failed.',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Please investigate /api/health and /api/metrics in production.'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['incident', 'ops']
            });
