services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # Pulled from GHCR by `docker compose pull`; `up --build` builds locally instead.
    image: ${BACKEND_IMAGE:-ghcr.io/laufferw/forhumanity-backend:latest}
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - MONGODB_URI=mongodb://mongo:27017/forHumanity
      - PORT=5000
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/laufferw/forhumanity-frontend:latest}
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: /api
    restart: unless-stopped
    # Only reachable from this host: the TLS reverse proxy (deploy/) is the
    # public entry point. Exposing this publicly would let clients bypass TLS
    # and spoof X-Forwarded-For past TRUST_PROXY.
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
